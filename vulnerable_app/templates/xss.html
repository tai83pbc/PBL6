<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XSS Vulnerability</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        input[type="text"] { width: calc(100% - 100px); padding: 8px; margin-top: 5px; }
        input[type="submit"] { padding: 8px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .result { margin-top: 20px; padding: 10px; background-color: #f8f9fa; border: 1px dashed #ccc; }
        .back-link { display: block; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reflected XSS Vulnerability</h1>
        <p>Enter something into the search box. Your input will be reflected directly into the page without proper escaping.</p>
        <form action="/xss" method="GET">
            <label for="query">Search:</label>
            <input type="text" id="query" name="query" value="{{ query_input | default('') }}">
            <input type="submit" value="Search">
        </form>
        
        {% if query_input %}
            <div class="result">
                <h3>You searched for:</h3>
                <!-- THIS IS THE VULNERABLE SPOT -->
                <p>{{ query_input | safe }}</p>
                <!--
                The '| safe' filter in Jinja2 (Flask's templating engine)
                explicitly tells it NOT to escape the HTML.
                This creates the XSS vulnerability.
                If '| safe' was removed, Flask would automatically escape it.
                -->
            </div>
        {% endif %}
        <a href="/" class="back-link">Back to Home</a>
    </div>
</body>
</html>
